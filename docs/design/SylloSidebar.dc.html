<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&amp;family=Nunito:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="https://unpkg.com/lucide-static@0.460.0/font/lucide.css">
</helmet>
<div style="width:232px;height:100%;flex:none;background:#90e0f3;border-right:2px solid #0f2a3a;display:flex;flex-direction:column;padding:26px 14px 18px;gap:26px;box-sizing:border-box;font-family:Nunito, system-ui, sans-serif;color:#0f2a3a">
  <div style="display:flex;flex-direction:column;gap:6px;padding:0 8px">
    <div style="display:flex;align-items:center;font-family:Fredoka, sans-serif;font-weight:600;font-size:30px;letter-spacing:-.02em;line-height:1;color:#0f2a3a">syll<span style="width:26px;height:26px;margin-left:2px;margin-top:5px;border-radius:50%;background:#ffffff;border:3px solid #0f2a3a;display:flex;align-items:center;justify-content:center;font-size:14px"><i class="icon-check"></i></span></div>
    <div style="display:flex;flex-direction:column">
      <span style="font-size:12px;color:#134a5e">Zamalek Learning Center</span>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
      <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;background:{{ it.bg }};color:{{ it.fg }};font-weight:{{ it.fw }};font-size:14px;box-shadow:{{ it.sh }}">
        <i class="icon-{{ it.icon }}" style="font-size:18px;line-height:1"></i>
        <span style="flex:1">{{ it.label }}</span>
        <sc-if value="{{ it.badge }}" hint-placeholder-val="{{ false }}">
          <span style="min-width:22px;height:22px;padding:0 7px;box-sizing:border-box;border-radius:999px;background:#ff6f9f;color:#0f2a3a;border:2px solid #0f2a3a;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ it.badge }}</span>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <div style="margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:20px;background:#ffffff;border:2px solid #0f2a3a;box-shadow:3px 3px 0 #0f2a3a">
    <div style="width:36px;height:36px;border-radius:50%;background:{{ avatarBg }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">{{ initials }}</div>
    <div style="display:flex;flex-direction:column;line-height:1.25">
      <span style="font-size:14px;font-weight:600">{{ userName }}</span>
      <span style="font-size:12px;color:#57656d">{{ roleLabel }}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:232,&quot;height&quot;:900},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;tutor&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const role = this.props.role ?? 'admin';
    const active = this.props.active ?? 'Dashboard';
    const admin = [
      ['Dashboard','layout-dashboard'],['Requests','repeat',4],['Students','graduation-cap'],['Tutors','users'],
      ['Assign student','user-plus'],['Payments','wallet'],['Analytics','chart-column'],['Settings','settings']
    ];
    const tutor = [['Dashboard','layout-dashboard'],['Calendar','calendar'],['Availability','clock'],['My earnings','wallet']];
    const items = (role === 'tutor' ? tutor : admin).map(([label, icon, badge]) => {
      const on = label === active;
      return { label, icon, badge: badge || 0, bg: on ? '#ffffff' : 'transparent', fg: '#0f2a3a', fw: on ? 700 : 500, sh: on ? '0 0 0 2px #0f2a3a, 3px 3px 0 2px #0f2a3a' : 'none' };
    });
    const t = role === 'tutor';
    return { items, userName: t ? 'Omar Fathy' : 'Mariam Adel', roleLabel: t ? 'Tutor · Math' : 'Admin', initials: t ? 'OF' : 'MA', avatarBg: t ? '#8c7cf0' : '#ff6f9f' };
  }
}
</script>
</body>
</html>
